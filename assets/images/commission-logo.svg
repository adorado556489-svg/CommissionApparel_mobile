<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;display=swap');
            .logo-body { fill: currentColor; font-family: 'Outfit', sans-serif; font-weight: 900; }
        </style>
        <mask id="apparel-mask">
            <!-- Everything under white is visible, under black is hidden -->
            <rect x="0" y="0" width="100%" height="100%" fill="white" />
            <!-- Punch out the text inside the rectangle -->
            <text x="312" y="123" fill="black" font-family="'Outfit', sans-serif" font-weight="900" font-size="62" letter-spacing="14" text-anchor="middle">APPAREL</text>
        </mask>
    </defs>
    
    <g class="logo-body">
        <!-- Vertical THE -->
        <text x="-65" y="32" transform="rotate(-90)" font-size="28" letter-spacing="4" text-anchor="middle">THE</text>
        
        <!-- COMMISSION -->
        <text x="50" y="65" font-size="76">COMMISSION</text>
        
        <!-- APPAREL Box - Punched out using mask -->
        <rect x="52" y="74" width="520" height="60" mask="url(#apparel-mask)" />
    </g>
</svg>
